[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polbot"
version = "1.0.0"
description = "Market-making bot for Polymarket 5-minute crypto Up/Down markets: two-sided limit-order ladder, refresh-and-repost, pull before close, hold to resolution."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "analyshd-crypto" }]
requires-python = ">=3.10"
dependencies = [
    "polymarket-client>=0.20.0",
]
keywords = ["polymarket", "market-making", "trading-bot", "prediction-markets", "crypto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
polbot = "polbot.cli:main"

[tool.setuptools.packages.find]
include = ["polbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require POLYMARKET_PRIVATE_KEY and spend nothing but touch the live CLOB",
]
